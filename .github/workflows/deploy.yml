name: Deploy to GitHub Pages

# Publishes the playable build to GitHub Pages so the game can be opened on a
# phone. The typecheck runs first and is a gate, not decoration: AGENTS.md makes
# `tsc --noEmit` clean a release condition, and a red build should never become
# the thing someone taps on their home screen.
on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a run
# that is mid-deploy can leave Pages serving a half-published site; queueing
# costs a minute and never does.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # README states Node 20+; 22 is what the project is developed against.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install` — package-lock.json is committed, and
      # a deploy should build the dependency tree that was tested, not resolve a
      # fresh one.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # THE RULES, NOT JUST THE TYPES.
      #
      # Three rule bugs reached a real player across waves 3 and 4 — a crate
      # that deleted anything handed to it, a bun welded to a chopping board,
      # and a burner that could never be cleared once its pan burned. Every one
      # of them typechecked, built, and screenshotted perfectly; the last of
      # them killed both burners a few minutes into every service.
      #
      # `npm test` runs the suite that catches that class: the station rules
      # asserted directly (planprobe), full services played out by the real
      # bots across many seeds (soak), and the camera sweeps checked against
      # the rig they claim to describe (camsync). It is pure Node — no browser,
      # no GPU — so it costs seconds, and a red suite must stop a deploy for
      # the same reason a red typecheck does: nobody should tap a broken game
      # on their home screen.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # vite.config.ts sets `base: './'`, so dist/ is position-independent and
      # works under the /sizzle-squad/ subpath Pages serves from. See the note
      # there for why an absolute base would break the tools/ harness.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
